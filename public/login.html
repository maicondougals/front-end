<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style/cadastro.css">
    <title>Front-end</title>
</head>
<body>
    <main>
        <form id="form">
            <h1 class="title">Bem vindo(a) a página de login com a API do repositório <a class="link" href="https://github.com/maicondougals/back-end" target="_blank" rel="noopener noreferrer">back-end</a>.</h1>
            <input type="text" id="name" placeholder="Insira seu nome">
            <input type="text" id="mail" placeholder="Insira seu email">
            <button type="submit" id="button" class="botao" id="botao">Enviar</button>
            <a href="http://127.0.0.1:5500/public/cadastro.html" id="button" class="botao botao-2">Cadastre-se</a>
            <p id="status">Resultado:</p>
            <h3 class="interroga" id="interroga">?</h3>
            <div class="interroga-container" id="interroga-container">
                <p>Ao digitar os dados e enviar, será mandado para uma API</p>
            </div>
        </form>
        
    </main>

</body>
<script src="js/login.js"></script>

</html>
